# sf0_base — BASELINE twin for the Self-Flow bake-off (doc/self_flow_plan.md).
# The fast model's depth-8 DiT arch on the same latents, 80k steps, seed 0.
# Identical to sf0_dualt / sf1_selfflow except for the experiment keys, so
# grid/val-loss differences are attributable to the method, not the setup.
latents: artifacts/m3_long_cfg/runs/vae/latents.npz
vae_ckpt: checkpoints/m3_long_cfg/vae_final.pt   # for eval-grid decoding
n_val: 2000
latent_ch: 8
latent_hw: 16

n_classes: 4
class_dropout: 0.1

arch: dit
act: relu2

dit:
  dim: 128
  depth: 8
  heads: 4
  patch: 2
  mlp_ratio: 4

t_embed_dim: 256
t_sampling: logit_normal
loss: mse

lr: 2.0e-4
warmup: 2000
batch_size: 256
steps: 80000
ema: 0.9995
log_every: 500
eval_every: 5000

out_dir: artifacts/sf0_base/runs/dit
seed: 0
